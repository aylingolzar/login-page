<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="header-text">login here</h1>
      </div>
      <form class="main">
        <div class="user-field">
          <input
            type="text"
            class="username"
            autocomplete="off"
            placeholder="enter yor username"
          />
          <p class="user-text hidden"></p>
        </div>
        <div class="password-field">
          <input
            type="password"
            class="password"
            autocomplete="off"
            placeholder="enter yor password"
          />
          <p class="pass-text hidden"></p>
        </div>
        <button class="btn">login:)</button>
        <div class="footer">
          <div class="linesection">
            <div class="line"></div>
            <p class="or">or login with</p>
            <div class="line"></div>
          </div>
          <button class="google">
            google
            <img
              src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"
              alt=""
            />
          </button>
        </div>
      </form>
    </div>
    <div class="after-all hidden">
      <img class="check" src="./images/check.png" alt="logo" />

      <button class="btn2">با موفقیت ثبت نام کردید</button>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
